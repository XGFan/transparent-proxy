version: 1
listen: ":1444"
# 填了才启用鉴权：非空时所有 /api/* 需带请求头 X-Api-Key（/panel.js 与静态资源不鉴权）
# api_key: ""
proxy:
    lan_interface: br-lan
    default_port: 1081
    forced_port: 1082
    self_mark: 255
checker:
    enabled: true
    method: HEAD
    url: http://www.google.com
    host: www.google.com
    timeout: 10s
    interval: 30s
    failure_threshold: 3
    on_failure: disable
nft:
    state_path: /etc/nftables.d
    sets:
        - direct_src
        - direct_dst
        - proxy_src
        - proxy_dst
        - allow_v6_mac
chnroute:
    auto_refresh: true
    refresh_interval: 168h
