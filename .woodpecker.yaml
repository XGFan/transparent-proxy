when:
  branch: master
  event: [push, manual]

steps:
  - name: build
    image: golang:1.25-alpine
    commands:
      - apk add --no-cache nodejs npm tar fakeroot gzip bash git python3
      - SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-8)
      # 路由器是 x86_64；脚本默认 aarch64_generic，不显式指定就会打出一个
      # opkg 判为「no valid architecture」的包。以前 opkg 每次都拒绝安装，
      # 这个错配从未暴露过。
      - OPENWRT_PACKAGE_ARCH=x86_64 bash scripts/build-openwrt-ipk.sh --version "v0.0.0-$SHORT_SHA"
      - ls -lh dist/ipk/*/artifacts/*.ipk
      - ls dist/ipk/*/artifacts/ | grep -q "_x86_64.ipk" || (echo "构建出的不是 x86_64 包" && exit 1)

  - name: deploy
    image: alpine
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$CI_SSH_KEY" > ~/.ssh/deploy_key
      - chmod 600 ~/.ssh/deploy_key
      - ssh-keyscan -H "$OPENWRT_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
      # 先清干净再传：失败的 run 会把自己的 ipk 留在 /tmp，下次 opkg 的通配符
      # 就会一次收到多个包(可能还带着历史遗留的错架构包)——实测会让 opkg 段错误。
      - ssh $SSH_OPTS "$OPENWRT_USER@$OPENWRT_HOST" 'rm -f /tmp/*.ipk'
      - scp $SSH_OPTS dist/ipk/*/artifacts/*.ipk "$OPENWRT_USER@$OPENWRT_HOST:/tmp/"
      - |
        ssh $SSH_OPTS "$OPENWRT_USER@$OPENWRT_HOST" \
          'set -e; opkg install --force-downgrade /tmp/transparent-proxy_*.ipk; opkg install --force-downgrade /tmp/luci-app-transparent-proxy_*.ipk; /etc/init.d/transparent-proxy restart; set +e; i=0; while [ $i -lt 30 ]; do pidof transparent-proxy >/dev/null && wget -q -O /dev/null -T 5 http://127.0.0.1:1444/panel.js && break; i=$((i+1)); sleep 3; done; rm -f /tmp/*.ipk; if [ $i -ge 30 ]; then echo "部署校验失败: 90s 内服务未就绪或 panel.js 缺失"; exit 1; fi; echo "部署校验通过"'
      - rm -f ~/.ssh/deploy_key
    environment:
      CI_SSH_KEY:
        from_secret: ci_ssh_key
      OPENWRT_HOST:
        from_secret: openwrt_host
      OPENWRT_USER:
        from_secret: openwrt_user

  - name: notify-success
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: success

  - name: notify-failure
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: failure
    when:
      - status: [failure]
