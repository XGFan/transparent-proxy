when:
  branch: master
  event: [push, manual]

steps:
  - name: build
    image: golang:1.25-alpine
    commands:
      - apk add --no-cache nodejs npm tar fakeroot gzip bash git python3
      - SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-8)
      # 路由器是 x86_64；脚本默认 aarch64_generic，不显式指定就会打出一个
      # opkg 判为「no valid architecture」的包。以前 opkg 每次都拒绝安装，
      # 这个错配从未暴露过。
      - OPENWRT_PACKAGE_ARCH=x86_64 bash scripts/build-openwrt-ipk.sh --version "v0.0.0-$SHORT_SHA"
      - ls -lh dist/ipk/*/artifacts/*.ipk
      - ls dist/ipk/*/artifacts/ | grep -q "_x86_64.ipk" || (echo "构建出的不是 x86_64 包" && exit 1)

  - name: deploy
    image: alpine
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$CI_SSH_KEY" > ~/.ssh/deploy_key
      - chmod 600 ~/.ssh/deploy_key
      - ssh-keyscan -H "$OPENWRT_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
      # 用独立目录 + 每次先清空：失败的 run 不会把 ipk 留给下一次，
      # 否则 opkg 的通配符会一次收到多个包(实测会段错误)。
      - ssh $SSH_OPTS "$OPENWRT_USER@$OPENWRT_HOST" 'rm -rf /tmp/tp-deploy && mkdir -p /tmp/tp-deploy'
      - scp $SSH_OPTS dist/ipk/*/artifacts/*.ipk deploy/openwrt/ci-deploy.sh "$OPENWRT_USER@$OPENWRT_HOST:/tmp/tp-deploy/"
      # 部署逻辑放脚本里而不是内联 ssh 一行：那一行要穿过 CI 容器 sh 与路由器
      # busybox ash 两层引号，实测会崩(opkg 段错误 / unterminated quoted string)。
      - ssh $SSH_OPTS "$OPENWRT_USER@$OPENWRT_HOST" 'sh /tmp/tp-deploy/ci-deploy.sh /tmp/tp-deploy'
      - ssh $SSH_OPTS "$OPENWRT_USER@$OPENWRT_HOST" 'rm -rf /tmp/tp-deploy'
      - rm -f ~/.ssh/deploy_key
    environment:
      CI_SSH_KEY:
        from_secret: ci_ssh_key
      OPENWRT_HOST:
        from_secret: openwrt_host
      OPENWRT_USER:
        from_secret: openwrt_user

  - name: notify-success
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: success

  - name: notify-failure
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: failure
    when:
      - status: [failure]
